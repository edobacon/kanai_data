# Sondas del intake de up1. Recetas deterministas que Kanai corre sobre el codigo base antes de
# planificar un ticket. Cada sonda levanta tarjetas de decision sobre los objetos que nombra el pedido.
# Se mantiene aca (KB del proyecto); kanai-app solo aporta los tipos de sonda (kind).
version: 1

catalog:
  # Mods cuyos objetos (JSON schema por objeto) forman el catalogo que recorren las sondas.
  repos:
    - academic-scheduling
    - ai-agent
    - curriculum-design
    - curriculum-mapping
    - retention-wellbeing
    - uengagement-up1
    - up1-manager
  # Repos cuyas sondas se calibraron con ruido medido (barrido de develop, 2026-10-09); el barrido advierte el resto.
  calibrated: [academic-scheduling, curriculum-design, curriculum-mapping]
  objects: "objects/**/*.json"
  # Etiquetas de negocio de los campos (i18n por objeto): un pedido que dice "peso" encuentra rollupWeight.
  fieldLabels:
    path: "lang/es/{object}.i18n.json"
    key: column

core:
  # CRUD generico del core: escribe cualquier objeto sin pasar por los resolvers del mod.
  repo: object-manager
  genericFile: src/graphql/resolvers/instance.resolver.js
  genericOps: [createInstance, updateInstance, deleteInstance, updateBulkInstances, deleteBulkInstances]

metrics:
  # Referencia sin sondas para medir el ahorro: los tickets del analisis de reactividad (143 a 152).
  # Todos los cerrados mezclan tickets livianos y subestiman lo que cuesta un hallazgo tardio.
  baseline: [TICKET-143, TICKET-144, TICKET-145, TICKET-146, TICKET-147, TICKET-148, TICKET-149, TICKET-150, TICKET-151, TICKET-152]

probes:
  - id: vias-de-escritura
    kind: write-paths
    params:
      resolvers: "logic/*.resolver.js"
      governance: ["ai/index.js", "ai/contracts.js"]

  - id: ciclo-de-vida-del-padre
    kind: parent-lifecycle
    params:
      stateField: status
      guards: ["logic/helpers/*Guard*.js", "logic/helpers/*guard*.js"]

  - id: perfil-x-operacion
    kind: profile-ops
    params:
      profiles: "profiles/*.json"

  - id: unicidad
    kind: uniques

  - id: reemplazo-total
    kind: full-replace
    params:
      siblings: "logic/*.resolver.js"
      siblingNames: "batch|upsert|bulk|set"

  - id: consumidores-cruzados
    kind: cross-consumers
    params:
      paths: ["logic/**", "modsComponents/**", "modsComposables/**"]

  - id: forma-de-entrada
    kind: input-shape

  - id: coherencia-de-referencias
    kind: reference-coherence
    params:
      depth: 4

  # Cuando el pedido cambia un mecanismo del core (una constante, un helper, un tipo de campo), levanta la
  # doc, los scripts y los tests del mismo core que lo nombran. Propuesta de kn-tassadar tras UPONE-2003:
  # en el backtest anticipa la doc del contrato y los e2e de clonacion; no ve una herramienta que no nombra
  # el mecanismo.
  - id: consumidores-del-core
    kind: core-contract-consumers
    params:
      source: "src/**"
      paths: ["docs/**", "scripts/**", "tests/**"]
      maxSourceFiles: 8

  # Sondas de la verificacion de consistencia (plan sp13). Todas con trigger: sin el, el ruido sobre el conjunto
  # de referencia llega a 1.00 tarjeta por ticket; con el, 0.20 (F8).
  - id: guardas-de-entrada
    kind: entry-guards
    trigger: '\bpermiso|\bcapability|\bautoriz|\bguard|\bacceso|\brol\b'
    params:
      source: graphql
      schemas: 'logic/*.graphql'
      resolvers: 'logic/*.resolver.js'
      helpers: 'logic/**/*.js'
      guards: ['\w*[cC]heckCapability', '\bhasCapability', '\brequireCapability', '\bcheckObjectPermissions', '\bloadCheckObjectPermissions', '\bcheckPermission', '\bwithObjectAuth', '\bwithCapability']
      declaredOpen: 'sin capability custom|sin rbac propio|lectura autenticada|solo exige sesion'

  - id: claves-de-idioma
    kind: field-keys
    trigger: 'lista|listado|columna|campo|idioma|traduc|etiqueta|layout|pantalla|grilla|tabla|vista'
    params:
      lang: 'lang/{locale}/{object}.i18n.json'
      common: ['lang/{locale}/common.i18n.json']
      locales: [es, en, pt]
      layouts: 'config/layouts/*.json'

  - id: relaciones-de-lista
    kind: list-relations
    trigger: 'lista|listado|columna|campo|layout|pantalla|grilla|tabla|vista'

  - id: alcance-organizacional
    kind: org-scope
    trigger: 'permiso|organizacion|alcance|tenant|contexto|objeto nuevo|nuevo objeto|crear objeto|rol|capability'
    params:
      coreObjects: ['objects/business/Base/*.json', 'objects/business/RecordTypes/*.json', 'objects/core/*.json']
      exempt: [core_User, core_Role, core_Capability, core_Context, core_RoleAssignment, core_RoleCapability, core_ObjectDefinition, core_FieldDefinition, core_Tenant, up1_suite_app, up1_layen_layout, up1_notification, Feedback]
