version: 1
catalog:
  source: openapi
  repos: [taomangalam]
  openapi:
    repo: taomangalam
    path: server/contract/openapi.yaml
probes:
  - { id: vias-de-escritura, kind: write-paths }
  - { id: perfil-x-operacion, kind: profile-ops }
  - { id: unicidad, kind: uniques }
  - { id: reemplazo-total, kind: full-replace }
  - { id: forma-de-entrada, kind: input-shape }
  - { id: coherencia-referencias, kind: reference-coherence }
  - { id: privilegios-de-rol, kind: role-grants, params: { migrations: 'server/prisma/migrations/**/migration.sql', schemaWords: 'schema|tabla|columna|prisma|ddl|migracion\s+(?:prisma|sql|postgres|postgresql|de\s+base|de\s+esquema|de\s+schema|desde\s+cero)' } }
  - { id: lint-de-docs, kind: docs-lint-baseline, params: { baseline: '.docs-baseline.txt', riskyPattern: '\|-' } }
