case_id: kanai-verificacion-obligatoria
title: "Verificación obligatoria: la red que atrapa lo que el gate no ve"
objective: "Que la sesion de verificacion de un ticket sea OBLIGATORIA cuando el ticket la tiene: cada item pasa o queda no ejecutado CON SU MOTIVO (por ejemplo, sin PW disponible), de modo que se pueda retomar de forma informada o saber por que se omitio y se pudo seguir, y Kanai pueda informar por que. En la ejecucion de epica la politica se vuelve obligatoria por defecto, en el mismo lugar donde hoy se fuerza autopilot autonomo; fuera de la epica sigue advisory, esperando la confirmacion del dev. Un ticket sin sesion de verificacion no se ve afectado: se omite."
