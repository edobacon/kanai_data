plan_id: kanai-ejecucion-ticket
title: "Ejecución de ticket: por sesión contra por tarea, medido, con el testigo inline"
intent: Decidir con un experimento comparable si conviene seguir ejecutando una tarea por subagente en frío o llevar la sesión a un solo agente con las tareas encadenadas, y dejar la revisión a la altura de ese cambio. Primero se mide lo que hoy no se mide (utilización del ticket y relación entrada/salida), después se aísla el arranque en frío y se caracteriza el testigo del camino inline, después se habilita la sesión en un solo agente detrás de bandera y se refuerza la revisión, y recién entonces se corre la comparación de tres patas y se decide.
created: 2026-10-04T21:47:28.429Z
updated: 2026-10-04T22:05:02.189Z
tags:
  projects: []
  repos:
    - kanai-app
  tickets: []
  branches:
