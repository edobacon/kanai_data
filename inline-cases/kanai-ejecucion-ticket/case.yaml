case_id: kanai-ejecucion-ticket
title: "Kanai: ejecución de ticket por sesión contra por tarea, medida y con la revisión reforzada"
objective: Decidir con medición, no con intuición, si conviene seguir ejecutando una tarea por subagente en frío o llevar la sesión a un solo agente con las tareas encadenadas, y dejar la revisión a la altura de ese cambio. Cierra con un veredicto comparado (reloj, tokens de entrada y salida, vueltas de gate, hallazgos reales y escapes) y con la revisión reforzada encendida o descartada con su motivo.
