case_id: kanai-post-epica
title: "Kanai post-piloto: acelerar el motor con el gate verificando de verdad"
objective: "Bajar a la mitad el costo en tokens y las vueltas por ticket sin perder calidad verificable: que el gate verifique lo que hizo la sesión, que un hallazgo no accionable no dispare un bucle de auto-corrección, que el trabajo se pague por sesión y que la ceremonia de confirmación no cueste vueltas. Sujeto a análisis de métricas contra el baseline del caso pre-épica; no se activa durante el piloto de la épica."
