case_id: usuite-15425
title: "USUITE-15425: logs de autenticación seguros y siempre visibles"
objective: Que ningún log del módulo de autenticación exponga contraseñas, claves o tokens, conservando la utilidad de los logs para soporte (quién inició sesión, cuándo y con qué resultado), con una solución configurable que funcione en cualquier ambiente aunque no tenga configuración.
