          command: files=$( (git diff --name-only origin/develop...HEAD -- '*.js'; git -C server/api/user-api diff --name-only origin/develop...HEAD -- '*.js' | sed 's#^#server/api/user-api/#') ); docker run --rm -v "$PWD":/w -w /w node:10.24.1-alpine3.11 sh -c 'for f in "$@"; do node --check "$f" || exit 1; echo "ok $f"; done' _ $files
          repo: sandbox-api
          how: Desde la raíz de sandbox-api.
          expect: Una línea "ok <archivo>" por archivo modificado y ningún error.
          exit_code: 0
      - id: F7.c3
        text: "Las tres salidas del smoke guardadas en el KB del caso (`smoke-f7.md`) y revisadas, con una línea por escenario: qué se esperaba y qué salió."
        kind: evidence
    effort: 0,25 a 0,5 días.
  - code: F8
    title: Documentación
    goal: "que cualquier persona del equipo pueda usar, configurar y diagnosticar el helper sin leer su código: JSDoc completo, guía de uso y ejemplo en la plantilla de configuración."
    owner: dev del ticket, con revisión de otra persona del equipo.
    prerequisites:
      - id: F8.pre1
        text: Registro de F7 completo (el comportamiento documentado ya está verificado).
      - id: F8.preR
        text: 'Rama de trabajo al día en user-api y sandbox-api: tras `git fetch origin`, `git status -sb` sin "behind" y `git log --oneline HEAD..origin/develop` vacío (si la base avanzó, integrarla y volver a correr los tests). Evidencia: esa salida por repo.'
    tasks:
      - code: F8.1
        text: "**JSDoc** en `logSanitizer.js` y `authLog.js` (descripciones en español):"
        detail: |-
          - encabezado de módulo con el propósito y un enlace a `LOGGING.md`;
          - `@typedef` de `LogMaskingConfig`, `MaskingStrategyConfig`, `MaskLevel`, `MaskStrategy` y `TextDetectionConfig`, con cada opción, su tipo y su default;
          - `@param`, `@returns` y `@example` en `sanitizeForLog`, `maskValue`, `authLog.info`, `authLog.warn` y `authLog.error`;
          - las garantías y los marcadores posibles.
        kb:
          - plan-original.md#api
          - plan-original.md#configuracion-log-masking-en-local-env-js-todo-opcional
      - code: F8.2
        text: "**Guía `server/api/user-api/helpers/LOGGING.md`:**"
        detail: |-
          - qué resuelve y cuándo usar `authLog` (y por qué no `console.*`);
          - catálogo base por estrategia y tabla de niveles con ejemplos;
          - cómo se comparan los nombres (`keys`, `patterns`, último tramo de URL);
          - todas las opciones con default, efecto y si afectan la seguridad;
          - ejemplos: cambiar el nivel de nombres, agregar un campo, agregar un patrón, excluir un campo, mover `ds_name` a `id`, apagar la ofuscación;
          - avisos que emite al arrancar y cómo interpretarlos;
          - relación con `loggerLevel` y cómo verificar ambos en un pod;
          - cómo correr los tests (Docker con la imagen de producción);
          - resolución de problemas: `[MaxDepth]`, `...[truncado]`, `[SANITIZE_ERROR]`, `[Circular]`, "no veo los logs de auth", "un campo nuevo sale completo".
        kb:
          - plan-original.md#estrategias-y-niveles
          - plan-original.md#catalogo-base-dentro-del-helper
          - plan-original.md#como-correr-los-tests
      - code: F8.3
        text: "**Plantilla de ejemplo** `sandbox-api/server/config/local.env.sample.backend.js`: bloque `LOG_MASKING` comentado con los defaults y `loggerLevel: 'info'`, con un comentario que apunte a la guía."
        kb:
          - plan-original.md#configuracion-log-masking-en-local-env-js-todo-opcional
      - code: F8.4
        text: "**KB del caso:** si el comportamiento final cambió respecto del análisis, agregar al KB del caso un documento de tipo decisión o revisión con lo que cambió y por qué. No se edita plan-original.md (copia congelada del import)."
    criteria:
      - id: F8.c1
        text: "`npx jsdoc -c jsdoc.json server/api/user-api/helpers -d /tmp/usuite-15425-jsdoc` sin errores ni advertencias y con los `@typedef` en la salida (puede correr con el Node del host). *Evidencia:* salida del comando."
        kind: command
        run:
          command: npx jsdoc -c jsdoc.json server/api/user-api/helpers -d /tmp/usuite-15425-jsdoc
          repo: sandbox-api
          how: Desde la raíz de sandbox-api. La salida va a /tmp/usuite-15425-jsdoc, fuera del repo, para no dejar archivos generados en el repo.
          expect: Sin errores ni advertencias y con los @typedef en la salida.
          exit_code: 0
      - id: F8.c2
        text: "`LOGGING.md` revisado por otra persona del equipo. *Evidencia:* quién revisó, fecha y observaciones atendidas."
        kind: evidence
      - id: F8.c3
        text: Commits de documentación en `user-api` y `sandbox-api`.
        kind: command
        run:
          command: for r in . server/api/user-api; do echo "== $r"; (cd "$r" && git log --oneline --stat origin/develop..HEAD -- "*.md" "*.sample.backend.js" helpers) || exit 1; done
          repo: sandbox-api
          how: "Desde la raíz de sandbox-api: recorre sandbox-api y user-api."
          expect: "Commits de documentación en ambos repos: LOGGING.md y JSDoc en user-api, plantilla local.env.sample.backend.js en sandbox-api."
          exit_code: 0
    effort: 0,5 a 0,75 días.
  - code: F9
    title: QA y entrega a master (línea normal)
    goal: llevar el cambio a `master` en ambos repos, validado en la QA de uvmcl, para que quede listo para cualquier ambiente de la línea normal.
    owner: dev del ticket. El despliegue en QA y producción lo hace quien despliega y lo informa (queda en despliegue-uvmcl.md del KB del caso).
    prerequisites:
      - id: F9.pre1
        text: Registros de F0 a F8 completos (fases cerradas).
      - id: F9.pre2
        text: "Si F0.2 dijo que uvmcl está en la línea secure: F10 se hace en paralelo y la QA de uvmcl se hace con lo de F10."
    tasks:
      - code: F9.1
        text: 'Antes de abrir los PR: `git fetch`, integrar lo último de `origin/develop` en las ramas 1 y 2 y volver a correr las dos suites. Después, PR de la rama 1 (`user-api`) y de la rama 2 (`sandbox-api`) a `develop`. *Responder:* salida de "Rama actualizada", resultado de las suites, enlace de cada PR, revisores y estado.'
        kb:
          - plan-original.md#ramas-y-pr
          - plan-original.md#orden-de-entrega
        run:
          command: for r in . server/api/user-api; do echo "== $r"; (cd "$r" && git fetch origin && git status -sb && git log --oneline HEAD..origin/develop) || exit 1; done
          repo: sandbox-api
          how: Desde la raíz de sandbox-api, antes de abrir los PR. Si el git log no sale vacío, integrar origin/develop y volver a correr las dos suites.
          expect: 'Por repo: rama sin "behind" y git log vacío.'
          exit_code: 0
      - code: F9.2
        text: "Con `uvmcl-retention-qa` desplegado (lo informa quien despliega: fecha, ambiente y rama por repo; guardarlo en el KB del caso como documento de tipo registro `despliegue-uvmcl.md`), ejecutar Q1 a Q10 (evidencia: `kubectl logs` filtrado por `clave|password|Login user response|OCULTO` y evento de Sentry si aplica)."
        detail: |-
          | # | Caso | Esperado |
          |---|---|---|
          | Q1 | Login correcto | Entra normal; sesión completa (nombre, correo, rol, permisos). **Caso crítico** |
          | Q2 | Log de Q1 | `[info]: Login user response` con fecha, `CLAVE: [OCULTO]`, correos e identificadores `light`, nombres y códigos completos |
          | Q3 | Clave incorrecta | Mismo mensaje al usuario; log con resultado y sin la clave |
          | Q4 | Login de estudiantes, correcto y fallido (si aplica) | Igual que antes; log sanitizado |
          | Q5 | Ambiente **sin** `LOG_MASKING` | Funciona con defaults, sin errores ni avisos |
          | Q6 | Con `LOG_MASKING` de prueba (`text: light`, `id: medium`, un `addPatterns`) y reinicio | Cada estrategia con su nivel |
          | Q7 | Con `loggerLevel: 'info'` (configurado en el despliegue) | Logs de auth visibles; `silly` y `debug` no |
          | Q8 | Error del WebService (simulado) | Mensaje de siempre; navegador sin error crudo; Sentry sanitizado |
          | Q9 | Relevamiento de campos repetido en QA | Ningún campo de `block` con valor visible |
          | Q10 | Regresión | Navegar el módulo de retención y cerrar sesión sin errores nuevos |
        kb:
          - plan-original.md#despliegue-manual-fuera-de-la-guia-de-ejecucion
      - code: F9.3
        text: PR de `develop` a `master` en cada repo, confirmando antes que `develop` solo suma este ticket respecto de `master` (`git log --oneline origin/master..origin/develop`). *Responder:* salida de ese comando, enlaces y SHA del merge.
        kb:
          - plan-original.md#ramas-y-pr
        run:
          command: for r in . server/api/user-api; do echo "== $r"; (cd "$r" && git fetch origin && git log --oneline origin/master..origin/develop) || exit 1; done
          repo: sandbox-api
          how: Desde la raíz de sandbox-api, después de mergear los PR a develop.
          expect: "Por repo: solo commits de USUITE-15425."
          exit_code: 0
    criteria:
      - id: F9.c1
        text: Tests T1 a T45 en verde en la imagen de producción, chequeo estático en cero, `node --check` sin errores, smoke guardado, JSDoc sin errores y `LOGGING.md` revisado (de F1 a F8). *Evidencia:* referencia a los criterios registrados de F1 a F8.
        kind: evidence
      - id: F9.c2
        text: Q1 a Q10 aprobados, cada uno con su evidencia.
        kind: evidence
      - id: F9.c3
        text: PR a `master` mergeados en ambos repos. *Evidencia:* enlace de cada PR y SHA del merge.
        kind: evidence
    effort: 0,75 a 1 día.
    delivers: true
    rollback: En cada repo afectado, PR con `git revert -m 1 <SHA del merge>` a `develop` y, si ya llegó, otro a `master`; luego volver a desplegar en uvmcl la rama anterior (quien despliega). El cambio solo toca logs y no modifica datos, así que revertir no deja residuos.
  - code: F10
    title: Paso a la línea secure
    goal: llevar el mismo cambio a `feature/secure-master` en ambos repos sin romper el login con cookies propio de esa línea, para que quede listo para cualquier ambiente de la línea secure.
    owner: dev del ticket. Si la QA necesita un ambiente secure desplegado, lo hace quien despliega y queda en despliegue-uvmcl.md del KB del caso.
    prerequisites:
      - id: F10.pre1
        text: F9.1 a F9.3 con registro (o F7 completo, si F10 se adelantó por F0.2).
      - id: F10.pre2
        text: Lista de SHA de la línea normal a reaplicar, en el orden de "Estructura de commits".
    tasks:
      - code: F10.1
        text: "`git fetch` y crear `USUITE-15425-logs-auth-seguros-secure` desde `origin/feature/secure-develop` actualizado en `user-api` y `sandbox-api`. Antes de aplicar commits, tomar la línea base de la suite existente en esta rama. *Responder* en el registro de la tarea: commit base por repo y la línea base (total, pasan, fallan, omitidos y fallos preexistentes). Se registra en el plan (registro validado), no en las tablas ni plantillas de plan-original.md: esa es la copia congelada del import y no se edita."
        kb:
          - plan-original.md#linea-base-de-tests
          - plan-original.md#tests-que-ya-existen-verificado-el-2026-10-01
        run:
          command: for r in . server/api/user-api; do echo "== $r"; (cd "$r" && git fetch origin && git checkout -b USUITE-15425-logs-auth-seguros-secure origin/feature/secure-develop && git rev-parse --short HEAD && git status -sb) || exit 1; done && docker run --rm -v "$PWD":/w -w /w -e NODE_ENV=test node:10.24.1-alpine3.11 node node_modules/.bin/mocha --opts server/test/mocha-opts/mocha.user.opts
          repo: sandbox-api
          how: Desde la raíz de sandbox-api (user-api vive en server/api/user-api), con Docker corriendo. Crea la rama secure en ambos repos y corre la suite existente.
          expect: "Por repo: SHA base y la rama nueva; después, el resumen de mocha (N passing / N failing / N pending)."
      - code: F10.2
        text: "`git cherry-pick -x` de los commits de la línea normal, en orden. Resolver conflictos archivo por archivo, conservando el comportamiento propio de secure (cookies `httpOnly`, logout con `req.jwt.userId`). *Responder:* por cada commit: SHA original → SHA en secure → con o sin conflicto → cómo se resolvió."
        kb:
          - plan-original.md#estrategia-de-entrega-d6
          - plan-original.md#estructura-de-commits-para-que-el-cherry-pick-sea-simple
          - plan-original.md#precedente
      - code: F10.3
        text: Buscar logs que **solo existen en secure** (código de USUITE-12513 en `authentication/auth.js`, `index.js`, `loginServices.js`, `multiAuth/*`) y convertirlos en un commit propio de esta rama. *Responder:* archivo:línea de cada log convertido.
        kb:
          - plan-original.md#estado-de-las-ramas-verificado-el-2026-10-01
      - code: F10.4
        text: "Repetir en esta rama: tests T1 a T45 en Docker, suite existente comparada con **su** línea base (la de `feature/secure-develop`), chequeo estático de F7 en cero, `node --check` y smoke local."
        kb:
          - plan-original.md#como-correr-los-tests
      - code: F10.5
        text: "Antes del PR: `git fetch`, integrar lo último de `origin/feature/secure-develop` y volver a correr las suites. PR a `feature/secure-develop` → QA → PR a `feature/secure-master`, confirmando antes que `feature/secure-develop` solo suma este ticket respecto de `feature/secure-master`."
        kb:
          - plan-original.md#ramas-y-pr
      - code: F10.6
        text: "QA en un ambiente de la línea secure: Q1 a Q3, Q5, Q8 y Q10 de F9, más el logout (las cookies se borran y no hay errores nuevos)."
        kb:
          - plan-original.md#despliegue-manual-fuera-de-la-guia-de-ejecucion
    criteria:
      - id: F10.c1
        text: Chequeo estático en cero en la rama secure y tests T1 a T45 en verde.
        kind: command
        run:
          command: grep -rnE "console\.(log|error|warn|info)\(|logger\.(error|warn|info|http|verbose|debug|silly)\(|Sentry\.capture(Exception|Message)\(" server/api/user-api --include='*.js' | grep -vE "/(test|helpers)/"; docker run --rm -v "$PWD":/w -w /w node:10.24.1-alpine3.11 node node_modules/.bin/mocha "server/api/user-api/test/helpers/**/*.test.js"
          repo: sandbox-api
          how: Desde la raíz de sandbox-api, en la rama secure de ambos repos.
          expect: El grep sin salida y los tests del helper con 45 passing (o el número real) y 0 failing.
          exit_code: 0
      - id: F10.c2
        text: QA de F10.6 aprobada con evidencia, incluido el logout.
        kind: evidence
      - id: F10.c3
        text: PR a `feature/secure-master` mergeados en ambos repos. *Evidencia:* enlace de cada PR y SHA del merge.
        kind: evidence
    effort: 1 a 1,5 días.
    delivers: true
    rollback: En cada repo afectado, PR con `git revert -m 1 <SHA del merge>` a `feature/secure-develop` y, si ya llegó, otro a `feature/secure-master`; luego volver a desplegar la rama anterior en el ambiente secure afectado (quien despliega). Sin cambios de datos que deshacer.
