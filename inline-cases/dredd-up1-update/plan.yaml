        text: Congelar baseline y matriz de aceptación
        detail: Registrar contenido/hashes de ambos docs v1 en 348ea29 y pruebas por requisito. Fijar la convención de tests .claude/skills/dredd/scripts/tests/test_fN_<area>.py (suites nombradas en cada criterio de F1-F5) y el número mínimo de tests por fase, derivado de los casos de la matriz (nunca 0). Aislar trabajo futuro sin alterar checkout dirty y registrar commits posteriores al inicio de sus fases.
