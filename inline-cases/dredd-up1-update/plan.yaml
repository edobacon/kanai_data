plan_id: dredd-up1-update
title: "Dredd up1 1.1: plan de evolución autónoma"
intent: Una única entrega final 1.1 para Claude Code en macOS, Linux y Windows, con todas las mejoras acordadas y documentación operativa propia. Preservar íntegra la documentación v1 y generar comparación v1/1.1. Planificación actual no inicia implementación, publicación ni cambios de hooks globales.
tags:
  projects:
    - up1
  repos:
    - up1
  tickets: []
  branches:
    - feat/dredd-update
  folders: []
  labels:
    - dredd
    - tooling
    - autonomo
    - metricas
    - investigacion
settings:
  judge: final
risks:
  - Bash/fcntl y runners POSIX no prueban portabilidad Windows.
  - Ledger concurrente y guard deben aislar sesiones sin abrir bypass de seguridad.
  - Tokens/costo incompletos no se inventan; outcomes no equivalen automáticamente a precisión.
  - Decisiones de jurado, Jira local, rúbrica y retención siguen pendientes hasta F0.
  - Checkout con cambios ajenos; aislar ejecución sin descartar ni mezclar su trabajo.
  - Validación real Linux/Windows requiere ambientes y responsables; un test macOS no los sustituye.
out_of_scope:
  - Dependencias/referencias a plataformas de gestión o búsqueda excluidas en el producto up1.
  - Cambios de funcionalidad o repos de módulos de up1.
  - Codex como cliente objetivo; dashboards o servicios de métricas remotos.
  - Push, PR, merge, despliegue, comentarios externos o instalación global automática.
  - Modificar o reemplazar los documentos históricos v1.
  - Ejecutar ahora la implementación o dar por corridas pruebas futuras.
phases:
  - code: F0
    title: Cerrar contexto y contrato 1.1
    goal: Resolver decisiones y fijar aceptación antes de cambios de implementación.
    owner: Responsable del caso; validación de comandos por el dev
    prerequisites:
      - id: F0.P1
        text: El usuario autoriza el plan; documentos base y repos verificados, sin iniciar implementación.
    tasks:
      - code: F0.1
        text: Resolver políticas pendientes
        detail: Confirmar jurado/costo, Jira en pre-envío, severidad/veredictos, límite de workers/modelos, presupuesto y retención/anonimización. Registrar propuestas y decisiones humanas por separado.
        kb:
          - contexto-y-alcance.md#11-decisiones-abiertas-y-dependencias-del-plan
      - code: F0.2
        text: Definir soporte y arquitectura portable
        detail: Fijar versiones/capacidades Python/git, helper portable, identidad de sesiones, lock o parent escritor, runners por OS y fuente real de tokens. Asignar validación Linux/Windows.
        kb:
          - contexto-y-alcance.md#7-arquitectura-autonoma-a-evaluar
      - code: F0.3
        text: Congelar baseline y matriz de aceptación
        detail: Registrar contenido/hashes de ambos docs v1 en 348ea29 y pruebas por requisito. Aislar trabajo futuro sin alterar checkout dirty y registrar commits posteriores al inicio de sus fases.
        kb:
          - version-1.1-y-conservacion-v1.md
          - contexto-y-alcance.md#10-evidencia-requerida-para-aceptar-la-entrega
    criteria:
      - id: F0.C1
        text: Decisiones pendientes resueltas con motivo y responsable; autorización de implementación registrada.
        kind: manual
      - id: F0.C2
        text: Contrato de interfaces, entornos, rúbrica y matriz de pruebas disponibles en el KB.
        kind: evidence
      - id: F0.C3
        text: Hashes/docs v1 congelados y estrategia para preservar cambios ajenos verificable.
        kind: evidence
