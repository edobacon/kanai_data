    tasks:
      - code: F1.1
        text: Adaptar helper y prefetch
        detail: Inventarios paginados, errores HTTP/timeouts/rate-limit explícitos, refs exactos y prefetch único. Núcleo portable acordado; compatibilidad con llamadas previas o migración documentada.
        kb:
          - contexto-y-alcance.md#4-problemas-que-condicionan-el-diseno
      - code: F1.2
        text: Aislar estado y progreso
        detail: Run/session IDs y escrituras concurrentes sin pérdidas; TTL/end/close coherentes, cancelación y cleanup propio. Cerrar sólo la corrida que corresponde.
