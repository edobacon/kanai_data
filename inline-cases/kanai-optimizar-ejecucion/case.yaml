case_id: kanai-optimizar-ejecucion
title: Optimizar la ejecución de tickets en Kanai (caso base TAO-192)
objective: Reducir rebotes, tokens y tiempo de calendario al ejecutar tickets cuyo alcance ya está fijado, cambiando solo el cómo (base del diff del gate integral, verificación real en sandbox, rondas del gate N3, contexto del gate, seguimiento de tiempos), con los cambios implementados en kanai-app y validados con un ticket de prueba en KT y con la repetición del gate N3 de TAO-192, sin modificar el alcance de ningún ticket existente.
