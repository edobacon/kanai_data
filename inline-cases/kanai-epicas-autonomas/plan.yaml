      - code: F12.3
        text: Repo de la épica por nombre o id, normalizado al nombre en canonicalDraft y repoRoot, con mensaje que liste los repos válidos; documentar el caso monorepo registrado por subcarpetas en kn-epic. Tests con id distinto del nombre.
        kb:
