    criteria:
      - id: F4-C1
        text: Ticket sólo desbloquea dependientes cuando está verificado e integrado en la rama seleccionada.
        kind: evidence
      - id: F4-C2
        text: Fallos inyectados después de efectos Git no duplican commits, PR ni integraciones; conflictos se reportan.
        kind: evidence
