plan_id: kanai-epicas-autonomas
title: Épicas con planificación y ejecución autónoma encadenada
intent: Implementar el plan acordado de épicas autónomas en Kanai, con permisos por harness, Teach/Skip, seguimiento de tickets, recuperación y métricas desde el inicio; evaluar piloto Tao Mangalam. Registrar el plan no inicia ejecución.
created: 2026-10-03T14:48:59.957Z
updated: 2026-10-03T15:35:39.926Z
tags:
  projects:
    - kanai_self
  repos:
    - kanai-app
  tickets: []
  branches: []
  folders: []
  labels:
    - epicas
    - autonomia
    - harness
    - metricas
    - piloto-taomangalam
settings:
  judge: final
risks:
  - Cierre humano actual por ticket requiere diseño explícito para cierre agregado.
  - Un harness puede exigir intervención que no permite anticipar; no prometer autonomía universal.
  - Validación tardía puede aumentar retrabajo; mantener comprobación por ticket.
  - Cambios de alcance o permisos invalidan autorización/evidencia afectada.
  - Muestras pequeñas no permiten concluir ahorro causal ni estabilidad.
out_of_scope:
  - Ejecución paralela en el MVP.
  - Coordinación multirrepositorio en el MVP.
  - Importación masiva de backlog.
  - Despliegue/publicación o merge sin la autorización aplicable.
  - Escritura directa al store o bypass de guards.
phases:
  - code: F1
    title: Contrato y preparación
    goal: Resolver las decisiones de diseño y establecer la base verificable antes de implementar.
    prerequisites:
      - id: F1-P1
        text: Plan registrado para revisión; antes de ejecutar, confirmar alcance, estado del repositorio y autorizaciones necesarias.
    tasks:
      - code: F1.1
        text: Inspeccionar modelo, FSM, rama acumuladora, Teach, permisos, UI y métricas existentes; documentar capacidades reutilizables y solapamientos con KANAI-KB009.
        kb:
          - plan-implementacion-epicas-autonomas.md
      - code: F1.2
        text: Definir contrato funcional, cierre agregado, semántica de Teach, primeros harnesses y política de revisión/CI. Seleccionar rama de trabajo y ambientes de validación, preservando cambios ajenos.
        kb:
          - plan-implementacion-epicas-autonomas.md
      - code: F1.3
        text: Definir esquema de eventos, fórmulas de métricas, baseline y plan de pruebas; registrar decisiones y estimar esfuerzo tras la inspección.
        kb:
          - plan-implementacion-epicas-autonomas.md
    criteria:
      - id: F1-C1
        text: Inventario y decisiones documentados con evidencia de código; incertidumbres visibles.
        kind: evidence
      - id: F1-C2
        text: Contrato revisado, rama de trabajo y ambientes definidos; no se confunde aprobación del plan con permisos efectivos.
        kind: evidence
    effort: Por estimar en F1 tras revisar el código y las capacidades existentes.
    delivers: false
    changes_code: false
    rollback: Conservar documentos y evidencia; corregir decisiones mediante enmienda auditada, sin modificar código ni borrar historial.
  - code: F2
    title: Modelo de épica, plan y corrida
    goal: Persistir composición, planes versionados y progreso recuperable.
    prerequisites:
      - id: F2-P1
        text: F1 cerrada con sus criterios y evidencia verificados.
    tasks:
      - code: F2.1
        text: Implementar entidades de épica, plan versionado y corrida con objetivo, alcance, tickets, repositorio, ramas y referencias externas.
        kb:
          - plan-implementacion-epicas-autonomas.md
      - code: F2.2
        text: Implementar estados y transiciones mediante el motor, distinción de validado en épica frente a entregado y bloqueo de corridas incompatibles.
        kb:
          - plan-implementacion-epicas-autonomas.md
      - code: F2.3
        text: Instrumentar eventos de estados y probar persistencia, compatibilidad, versionado y exclusión mutua.
        kb:
          - plan-implementacion-epicas-autonomas.md
    criteria:
      - id: F2-C1
        text: Modelo y transiciones verificados; corridas incompatibles no escriben simultáneamente.
        kind: evidence
      - id: F2-C2
        text: Eventos versionados y deduplicables; recuperación de estado sin escrituras directas al store.
        kind: evidence
    effort: Por estimar en F1 tras revisar el código y las capacidades existentes.
    delivers: false
    changes_code: true
    rollback: Revertir únicamente los commits de esta fase mediante el flujo acordado; conservar datos, eventos y evidencia. Si afecta persistencia, verificar compatibilidad y respaldos antes de aplicar cambios; no borrar corridas ni sobrescribir trabajo ajeno.
  - code: F3
    title: Composición y dependencias
    goal: Validar viabilidad y orden, contrastando declaraciones con el cuerpo de los tickets.
    prerequisites:
      - id: F3-P1
        text: F2 cerrada con sus criterios y evidencia verificados.
    tasks:
      - code: F3.1
        text: Implementar evaluación de contribución al objetivo, criterios y requisitos; resultado ejecutable/bloqueado/requiere ajuste por ticket.
        kb:
          - plan-implementacion-epicas-autonomas.md
      - code: F3.2
        text: Contrastar dependencias declaradas con cuerpo y criterios; registrar inferencias justificadas para decisión; detectar ciclos y requisitos externos.
        kb:
          - plan-implementacion-epicas-autonomas.md
      - code: F3.3
        text: Implementar orden determinista y revalidación por deriva; instrumentar decisiones y dependencias tardías.
        kb:
          - plan-implementacion-epicas-autonomas.md
    criteria:
      - id: F3-C1
        text: Ciclo, dependencia externa e incompatibilidad impiden aprobar el plan afectado.
        kind: evidence
      - id: F3-C2
        text: Inferencias no se aprueban automáticamente; compartir archivos no se trata por sí solo como dependencia; cambios relevantes invalidan el plan.
        kind: evidence
    effort: Por estimar en F1 tras revisar el código y las capacidades existentes.
    delivers: false
    changes_code: true
    rollback: Revertir únicamente los commits de esta fase mediante el flujo acordado; conservar datos, eventos y evidencia. Si afecta persistencia, verificar compatibilidad y respaldos antes de aplicar cambios; no borrar corridas ni sobrescribir trabajo ajeno.
