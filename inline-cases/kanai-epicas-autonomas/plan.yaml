      - code: F12.4
        text: Medir antes y después en memoria con los fixtures de Jormat y Tao; correr suite, typecheck y lint; revisión arbiter; registrar commits y reiniciar el MCP antes de la corrida de la cohorte Jormat.
        kb:
          - piloto-jormat-hallazgos-planificador.md
    criteria:
