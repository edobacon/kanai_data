plan_id: kanai-epicas-autonomas
title: Épicas con planificación y ejecución autónoma encadenada
intent: Implementar el plan acordado de épicas autónomas en Kanai, con permisos por harness, Teach/Skip, seguimiento de tickets, recuperación y métricas desde el inicio; evaluar piloto Tao Mangalam. Registrar el plan no inicia ejecución.
created: 2026-10-03T14:48:59.957Z
updated: 2026-10-06T22:28:20.837Z
tags:
  projects:
    - kanai_self
  repos:
    - kanai-app
  tickets: []
  branches: []
  folders: []
  labels:
    - epicas
    - autonomia
    - harness
    - metricas
    - piloto-taomangalam
settings:
  judge: final
risks:
  - Cierre humano actual por ticket requiere diseño explícito para cierre agregado.
  - Un harness puede exigir intervención que no permite anticipar; no prometer autonomía universal.
  - Validación tardía puede aumentar retrabajo; mantener comprobación por ticket.
  - Cambios de alcance o permisos invalidan autorización/evidencia afectada.
  - Muestras pequeñas no permiten concluir ahorro causal ni estabilidad.
out_of_scope:
  - Ejecución paralela en el MVP.
  - Coordinación multirrepositorio en el MVP.
  - Importación masiva de backlog.
  - Despliegue/publicación o merge sin la autorización aplicable.
  - Escritura directa al store o bypass de guards.
phases:
  - code: F1
    title: Contrato y preparación
    goal: Resolver las decisiones de diseño y establecer la base verificable antes de implementar.
    prerequisites:
      - id: F1-P1
        text: Plan registrado para revisión; antes de ejecutar, confirmar alcance, estado del repositorio y autorizaciones necesarias.
    tasks:
      - code: F1.1
        text: Inspeccionar modelo, FSM, rama acumuladora, Teach, permisos, UI y métricas existentes; documentar capacidades reutilizables y solapamientos con KANAI-KB009.
        kb:
          - plan-implementacion-epicas-autonomas.md
      - code: F1.2
        text: Definir contrato funcional, cierre agregado, semántica de Teach, primeros harnesses y política de revisión/CI. Seleccionar rama de trabajo y ambientes de validación, preservando cambios ajenos.
        kb:
          - plan-implementacion-epicas-autonomas.md
      - code: F1.3
        text: Definir esquema de eventos, fórmulas de métricas, baseline y plan de pruebas; registrar decisiones y estimar esfuerzo tras la inspección.
        kb:
          - plan-implementacion-epicas-autonomas.md
    criteria:
      - id: F1-C1
        text: Inventario y decisiones documentados con evidencia de código; incertidumbres visibles.
        kind: evidence
      - id: F1-C2
        text: Contrato revisado, rama de trabajo y ambientes definidos; no se confunde aprobación del plan con permisos efectivos.
        kind: evidence
    effort: Por estimar en F1 tras revisar el código y las capacidades existentes.
    delivers: false
    changes_code: false
    rollback: Conservar documentos y evidencia; corregir decisiones mediante enmienda auditada, sin modificar código ni borrar historial.
