  - code: F1
    title: Helper de ofuscación (logSanitizer.js)
    goal: tener un helper que, dado cualquier dato, devuelva una copia con contraseñas y secretos bloqueados y correos, documentos y nombres ocultos según el nivel configurado, sin modificar el original y sin lanzar excepciones nunca.
